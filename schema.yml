          type: integer
      required:
      - receiver_wallet_id
    WalletTransferCreateRequest:
      type: object
      description: |-
        Validates inputs for creating a transfer request.
        Enforces:
        - Sender wallet exists and belongs to current user.
        - Receiver is provided either by wallet_id or phone_number.
        - No self-transfer between wallets of the same user.
        - Sender has enough spendable funds (balance - reserved).
      properties:
        sender_wallet_id:
          type: integer
        receiver_wallet_id:
          type: integer
        receiver_phone_number:
          type: string
        amount:
          type: integer
          minimum: 1
        description:
          type: string
          maxLength: 255
      required:
      - amount
      - sender_wallet_id
