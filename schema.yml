openapi: 3.0.3
info:
  title: SaeedPay API
  version: 1.0.0
  description: SaeedPay public API documentation
paths:
  /saeedpay/api/auth/public/v1/change-password/:
    post:
      operationId: api_auth_public_v1_change_password_create
      description: Change the password of the authenticated user.
      summary: Change password
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
        required: true
      security:
      - PublicAuth: []
      - PublicAuth: []
      responses:
        '200':
          description: Password changed successfully.
        '400':
          description: Validation failed.
  /saeedpay/api/auth/public/v1/login/:
    post:
      operationId: api_auth_public_v1_login_create
      description: Authenticate a user using phone number and password. Returns an
        access token and sets the refresh token cookie.
      summary: Login
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - PublicAuth: []
      - PublicAuth: []
      - {}
      responses:
        '200':
          description: Login successful.
        '400':
          description: Invalid credentials or inactive account.
  /saeedpay/api/auth/public/v1/logout/:
    post:
      operationId: api_auth_public_v1_logout_create
      description: Blacklist the current refresh token if present and clear the refresh
        cookie.
      summary: Logout
      tags:
      - Authentication
      security:
      - PublicAuth: []
      - PublicAuth: []
      - {}
      responses:
        '205':
          description: Logout successful.
        '200':
          description: Legacy success response.
  /saeedpay/api/auth/public/v1/register/customer/:
    post:
      operationId: api_auth_public_v1_register_customer_create
      description: Register a new customer account using phone number, OTP, and password.
        Returns an access token and sets the refresh token cookie.
      summary: Register customer
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterCustomerRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterCustomerRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterCustomerRequest'
        required: true
      security:
      - PublicAuth: []
      - PublicAuth: []
      - {}
      responses:
        '200':
          description: Customer registered successfully.
        '400':
          description: Validation failed.
  /saeedpay/api/auth/public/v1/register/merchant/:
    post:
      operationId: api_auth_public_v1_register_merchant_create
      description: Register a new merchant account using phone number, OTP, and password.
        Returns an access token and sets the refresh token cookie.
      summary: Register merchant
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterMerchantRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterMerchantRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterMerchantRequest'
        required: true
      security:
      - PublicAuth: []
      - PublicAuth: []
      - {}
      responses:
        '200':
          description: Merchant registered successfully.
        '400':
          description: Validation failed.
  /saeedpay/api/auth/public/v1/reset-password/:
    post:
      operationId: api_auth_public_v1_reset_password_create
      description: Reset a user's password using phone number, OTP, and a new password.
      summary: Reset password
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
        required: true
      security:
      - PublicAuth: []
      - PublicAuth: []
      - {}
      responses:
        '200':
          description: Password reset successfully.
        '400':
          description: Validation failed.
  /saeedpay/api/auth/public/v1/send-otp/:
    post:
      operationId: api_auth_public_v1_send_otp_create
      description: Send a verification code to a phone number for anonymous flows.
      summary: Send OTP
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendOTPRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SendOTPRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SendOTPRequest'
        required: true
      security:
      - PublicAuth: []
      - PublicAuth: []
      - {}
      responses:
        '200':
          description: OTP sent successfully.
        '400':
          description: Validation error or OTP already active.
  /saeedpay/api/auth/public/v1/token/refresh/:
    post:
      operationId: api_auth_public_v1_token_refresh_create
      description: Rotate the refresh cookie and issue a new access token. Session
        lifetime limits are enforced.
      summary: Refresh access token
      tags:
      - Authentication
      security:
      - PublicAuth: []
      - PublicAuth: []
      - {}
      responses:
        '200':
          description: Token refreshed successfully.
        '401':
          description: Refresh token is invalid or session has expired.
        '400':
          description: Token processing error.
  /saeedpay/api/auth/public/v1/user/send-otp/:
    post:
      operationId: api_auth_public_v1_user_send_otp_create
      description: Send a verification code to the authenticated user's phone number.
      summary: Send OTP for current user
      tags:
      - Authentication
      security:
      - PublicAuth: []
      - PublicAuth: []
      responses:
        '200':
          description: OTP sent successfully.
        '400':
          description: Validation error or OTP already active.
  /saeedpay/api/banking/v1/banks/:
    get:
      operationId: api_banking_v1_banks_list
      description: Retrieve a list of all available banks. Useful for displaying bank
        options in forms or interfaces.
      summary: List all banks
      tags:
      - Banking · Banks
      security:
      - PublicAuth: []
      - PublicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Bank'
              examples:
                List:
                  value:
                  - - id: 1
                      name: Mellat
                      logo: /media/banks/mellat.svg
                      color: '#e53935'
          description: ''
  /saeedpay/api/banking/v1/banks/{id}/:
    get:
      operationId: api_banking_v1_banks_retrieve
      description: Retrieve detailed information about a specific bank by its ID.
      summary: Get bank details
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Bank ID
        required: true
      tags:
      - Banking · Banks
      security:
      - PublicAuth: []
      - PublicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankDetail'
              examples:
                Detail:
                  value:
                    id: 1
                    name: Mellat
                    logo: /media/banks/mellat.svg
                    color: '#e53935'
                    created_at: '2025-01-01T08:00:00Z'
                    updated_at: '2025-01-02T09:10:00Z'
          description: ''
        '404':
          description: Bank not found
  /saeedpay/api/banking/v1/cards/:
    get:
      operationId: api_banking_v1_cards_list
      description: List active bank cards of the authenticated user (soft-deleted
        excluded). Ordered by default first, then most recent.
      summary: List user's bank cards
      tags:
      - Banking · Cards
      security:
      - PublicAuth: []
      - PublicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BankCard'
              examples:
                List:
                  value:
                  - - id: 1c2e8c3d-7e9f-4b2a-bb50-86d1b40c1abc
                      bank: 12
                      last4: '1234'
                      card_holder_name: Ali Ahmadi
                      is_default: true
                      status: verified
                      is_active: true
                      sheba: IR680170000000000000000000
                      created_at: '2025-01-10T12:00:00Z'
                      last_used: '2025-01-15T08:00:00Z'
                      rejection_reason: null
          description: ''
    post:
      operationId: api_banking_v1_cards_create
      description: |-
        Create a new card in PENDING, then enqueue async validation.
        Response uses output serializer to avoid exposing write-only fields.
      summary: Add a new bank card
      tags:
      - Banking · Cards
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BankCardCreateRequest'
            examples:
              CreatePayload:
                value:
                  card_number: '6037991234567890'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BankCardCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BankCardCreateRequest'
        required: true
      security:
      - PublicAuth: []
      - PublicAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankCard'
              examples:
                Created:
                  value:
                    id: c47a1a9d-9a7b-4f2a-8c69-1a2b3c4d5e6f
                    bank: 12
                    last4: '7890'
                    card_holder_name: ''
                    is_default: false
                    status: pending
                    is_active: true
                    sheba: null
                    created_at: '2025-01-10T12:00:00Z'
                    last_used: null
                    rejection_reason: null
          description: ''
        '400':
          description: Validation error
  /saeedpay/api/banking/v1/cards/{id}/:
    get:
      operationId: api_banking_v1_cards_retrieve
      description: User-owned bank cards (soft-delete). Write ops are throttled separately.
      summary: Get bank card details
      parameters:
      - in: path
        name: id
        schema:
          type: string
        description: Bank card UUID
        required: true
      tags:
      - Banking · Cards
      security:
      - PublicAuth: []
      - PublicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankCard'
          description: ''
        '404':
          description: Bank card not found
    put:
      operationId: api_banking_v1_cards_update
      description: User-owned bank cards (soft-delete). Write ops are throttled separately.
      summary: Update bank card
      parameters:
      - in: path
        name: id
        schema:
          type: string
        description: Bank card UUID
        required: true
      tags:
      - Banking · Cards
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BankCardUpdateRequest'
            examples:
              UpdatePayload:
                value:
                  card_number: '6219861234567890'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BankCardUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BankCardUpdateRequest'
        required: true
      security:
      - PublicAuth: []
      - PublicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankCard'
          description: ''
        '400':
          description: Only rejected cards can be updated.
        '404':
          description: Not found.
    patch:
      operationId: api_banking_v1_cards_partial_update
      description: User-owned bank cards (soft-delete). Write ops are throttled separately.
      summary: Partially update bank card
      parameters:
      - in: path
        name: id
        schema:
          type: string
        description: Bank card UUID
        required: true
      tags:
      - Banking · Cards
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedBankCardUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedBankCardUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedBankCardUpdateRequest'
      security:
      - PublicAuth: []
      - PublicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankCard'
          description: ''
        '400':
          description: Only rejected cards can be updated.
        '404':
          description: Not found.
    delete:
      operationId: api_banking_v1_cards_destroy
      description: User-owned bank cards (soft-delete). Write ops are throttled separately.
      summary: Delete bank card
      parameters:
      - in: path
        name: id
        schema:
          type: string
        description: Bank card UUID
        required: true
      tags:
      - Banking · Cards
      security:
      - PublicAuth: []
      - PublicAuth: []
      responses:
        '204':
          description: Bank card deleted
        '400':
          description: Card under review cannot be deleted.
        '404':
          description: Not found.
  /saeedpay/api/banking/v1/cards/{id}/set-default/:
    patch:
      operationId: api_banking_v1_cards_set_default_partial_update
      description: Set a verified card as default for current user. Automatically
        unsets previous default.
      summary: Set bank card as default
      parameters:
      - in: path
        name: id
        schema:
          type: string
        description: Bank card UUID
        required: true
      tags:
      - Banking · Cards
      security:
      - PublicAuth: []
      - PublicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankCard'
          description: ''
        '403':
          description: Only verified cards can be set as default.
        '404':
          description: Not found.
  /saeedpay/api/blogs/public/v1/articles/:
    get:
      operationId: api_blogs_public_v1_articles_list
      description: List visible articles. Anonymous users only see published articles
        with a publish date in the past. Authenticated users may also see their own
        drafts.
      summary: List articles
      parameters:
      - in: query
        name: author
        schema:
          type: number
        description: فیلتر بر اساس نویسنده
      - in: query
        name: is_featured
        schema:
          type: boolean
        description: فیلتر مقالات ویژه
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: published_after
        schema:
          type: string
          format: date-time
        description: مقالات منتشر شده بعد از تاریخ مشخص
      - in: query
        name: published_before
        schema:
          type: string
          format: date-time
        description: مقالات منتشر شده قبل از تاریخ مشخص
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          title: وضعیت
          enum:
          - archived
          - draft
          - published
        description: |-
          فیلتر بر اساس وضعیت

          * `draft` - پیش‌نویس
          * `published` - منتشر شده
          * `archived` - آرشیو شده
      - in: query
        name: tags
        schema:
          type: array
          items:
            type: integer
        description: فیلتر بر اساس برچسب‌ها (می‌توانید چند مقدار ارسال کنید)
        explode: false
        style: form
      tags:
      - Content · Articles
      security:
      - PublicAuth: []
      - PublicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedArticleListList'
              examples:
                List:
                  value:
                    count: 123
                    next: http://api.example.org/accounts/?page=4
                    previous: http://api.example.org/accounts/?page=2
                    results:
                    - - id: 10
                        title: How to save money
                        slug: how-to-save-money
                        author:
                          id: 2
                          username: author1
                          full_name: Sara Rezaei
                        excerpt: Top tips to manage your budget…
                        featured_image: /media/articles/a1.jpg
                        published_at: '2025-02-01T10:00:00Z'
          description: ''
  /saeedpay/api/blogs/public/v1/articles/{slug}/:
    get:
      operationId: api_blogs_public_v1_articles_retrieve
      description: Increment view count atomically and return article details.
      summary: Retrieve an article
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        description: Article slug or numeric ID.
        required: true
      tags:
      - Content · Articles
      security:
      - PublicAuth: []
      - PublicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleDetail'
              examples:
                Detail:
                  value:
                    id: 10
                    title: How to save money
                    slug: how-to-save-money
                    author:
                      id: 2
                      username: author1
                      full_name: Sara Rezaei
                    rendered_content: <h2>Intro</h2><p>...</p>
                    excerpt: Top tips to manage your budget…
                    featured_image: /media/articles/a1.jpg
                    status: published
                    tags:
                    - id: 1
                      name: Finance
                      slug: finance
                      color: '#1769aa'
                    sections:
                    - id: 1
                      section_type: text
                      content: Intro…
                      image: null
                      image_alt: ''
                      order: 1
                    - id: 2
                      section_type: image
                      content: null
                      image: /media/articles/img1.jpg
                      image_alt: chart
                      order: 2
                    is_featured: false
                    published_at: '2025-02-01T10:00:00Z'
                    view_count: 123
                    comment_count: 4
                    jalali_creation_date_time: 1403/11/12 14:12
                    jalali_update_date_time: 1403/11/12 15:01
                    comments: []
          description: ''
        '404':
          description: Article not found.
  /saeedpay/api/blogs/public/v1/comments/:
    get:
      operationId: api_blogs_public_v1_comments_list
      description: List approved root comments for an article or store. Authenticated
        users also see their own comments.
      summary: List comments
      parameters:
      - in: query
        name: article
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: store
        schema:
          type: integer
      tags:
      - Content · Comments
      security:
      - PublicAuth: []
      - PublicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCommentListList'
              examples:
                List:
                  value:
                    count: 123
                    next: http://api.example.org/accounts/?page=4
                    previous: http://api.example.org/accounts/?page=2
                    results:
                    - - id: 101
                        author:
                          id: 3
                          username: user12
                          first_name: Ali
                          last_name: Karimi
                        content: Great article!
                        rating: 5
                        reply_count: 2
                        replies: []
                        like_count: 8
                        dislike_count: 1
                        jalali_creation_date_time: 1403/11/12 14:20
          description: ''
    post:
      operationId: api_blogs_public_v1_comments_create
      description: ViewSet for comments with moderation-aware visibility and owner/staff
        edit rules.
      summary: Create a comment
      tags:
      - Content · Comments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentCreateRequest'
            examples:
              CreatePayload:
                value:
                  article: 10
                  store: null
                  reply_to: null
                  content: Nice!
                  rating: 5
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CommentCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CommentCreateRequest'
        required: true
      security:
      - PublicAuth: []
      - PublicAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
          description: ''
        '400':
          description: Validation error.
  /saeedpay/api/blogs/public/v1/comments/{id}/:
    get:
      operationId: api_blogs_public_v1_comments_retrieve
      description: ViewSet for comments with moderation-aware visibility and owner/staff
        edit rules.
      summary: Retrieve a comment
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this نظر.
        required: true
      tags:
      - Content · Comments
      security:
      - PublicAuth: []
      - PublicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
          description: ''
        '404':
          description: Comment not found.
    put:
      operationId: api_blogs_public_v1_comments_update
      description: ViewSet for comments with moderation-aware visibility and owner/staff
        edit rules.
      summary: Update a comment
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this نظر.
        required: true
      tags:
      - Content · Comments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CommentUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CommentUpdateRequest'
        required: true
      security:
      - PublicAuth: []
      - PublicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
          description: ''
        '400':
          description: Validation error.
        '403':
          description: Forbidden.
    patch:
      operationId: api_blogs_public_v1_comments_partial_update
      description: ViewSet for comments with moderation-aware visibility and owner/staff
        edit rules.
      summary: Partially update a comment
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this نظر.
        required: true
      tags:
      - Content · Comments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCommentUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCommentUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCommentUpdateRequest'
      security:
      - PublicAuth: []
      - PublicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
          description: ''
        '400':
          description: Validation error.
        '403':
          description: Forbidden.
    delete:
      operationId: api_blogs_public_v1_comments_destroy
      description: ViewSet for comments with moderation-aware visibility and owner/staff
        edit rules.
